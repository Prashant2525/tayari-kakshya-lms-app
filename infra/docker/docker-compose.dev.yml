# Local development infrastructure only. Ports are bound to 127.0.0.1.
# Credentials here are local-development defaults, NOT production secrets.
name: tayari-kakshya-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tayari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tayari_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-tayari_kakshya}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Captures all outgoing email in development: UI at http://localhost:8025
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  seaweedfs:
    # S3-compatible object storage standing in for Cloudflare R2 in development (T-020). S3 API on :8333.
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.port=8333',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-master.volumeSizeLimitMB=256',
        '-volume.max=0',
      ]
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweeddata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  redisdata:
  seaweeddata:
