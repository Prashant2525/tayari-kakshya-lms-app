packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - globals@17.13.0
  - turbo@2.11.6
  - bullmq@6.3.11
  - '@aws-sdk/client-s3@3.1145.0'
  - '@aws-sdk/s3-request-presigner@3.1145.0'
