packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  # Source-map upload tool (native binary) for release builds only; not run on developer machines (KI-011).
  '@sentry/cli': false
  argon2: true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - globals@17.13.0
  - turbo@2.11.6
  - bullmq@6.3.11
  - '@aws-sdk/client-s3@3.1145.0'
  - '@aws-sdk/s3-request-presigner@3.1145.0'
overrides:
  # Phase 15: GHSA advisory in shell-quote <1.11 (React DevTools in the app's dev tooling); same major version.
  shell-quote: ^1.11.0
# Phase 15 dependency audit (CI fails on high / critical). Known, reviewed and without a fixed release — remove an
# entry as soon as a fix ships (docs/SECURITY_REVIEW.md):
auditConfig:
  ignoreGhsas:
    # node-forge (Expo CLI, build machine only): RSA PKCS#1 v1.5 signature check; not used at runtime.
    - GHSA-86w9-cpqp-85rv
    # braces (Metro bundler, build machine only): stack exhaustion on crafted glob patterns.
    - GHSA-vfj7-8cjw-p6xm
